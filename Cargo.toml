[workspace]
resolver = "2"
members = [
  "apps/client/src-tauri",
  "crates/zhiweave-application",
  "crates/zhiweave-domain",
  "crates/zhiweave-markdown",
  "crates/zhiweave-protocol",
  "crates/zhiweave-storage",
  "server",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jacek4yang/zhiweave"

[workspace.dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.0"
axum = "0.8.9"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
tauri = "2.11.5"
tauri-build = "2.6.3"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
